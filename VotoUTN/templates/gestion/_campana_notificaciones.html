<a class="campana-notificaciones{% if request.resolver_match.url_name == 'mis-notificaciones' or request.resolver_match.url_name == 'leer-notificacion' %} activa{% endif %}" href="{% url 'mis-notificaciones' %}" aria-label="Notificaciones{% if notificaciones_no_leidas %}: {{ notificaciones_no_leidas }} sin leer{% endif %}" title="Notificaciones">
  <svg width="22" height="22" style="width:22px;height:22px;max-width:22px;flex:none" viewBox="0 0 24 24" focusable="false" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
  </svg>
  {% if notificaciones_no_leidas %}<span class="campana-indicador" aria-hidden="true">{% if notificaciones_no_leidas > 99 %}99+{% else %}{{ notificaciones_no_leidas }}{% endif %}</span>{% endif %}
</a>
