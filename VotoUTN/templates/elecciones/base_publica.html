{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Elecciones UTN.BA{% endblock %}</title>
  <link href="{% static 'css/gestion-electoral.css' %}" rel="stylesheet">
</head>
<body class="gestion-electoral">
  <header class="topbar">
    <a class="brand" href="{% url 'index' %}" aria-label="Elecciones UTN.BA">
      <span class="mark">UTN</span>
      <span class="brand-title"><strong>UTN.<i>BA</i></strong><small>Sistema de Gestion Electoral</small></span>
    </a>
    <a href="{% url 'keycloak_login' %}" class="btn primary">Iniciar sesión</a>
  </header>
  <main class="gestion-page">
    {% block content %}{% endblock %}
  </main>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
