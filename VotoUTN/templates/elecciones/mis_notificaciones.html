{% extends "elecciones/base_gestion.html" %}{% block content %}<section class="hero"><h1>Notificaciones</h1><p>Mensajes recibidos.</p></section><div class="table-wrap"><table><tbody>{% for n in notificaciones %}<tr><td><a href="{% url 'leer-notificacion' n.id %}">{{ n.asunto }}</a><br><span class="muted">{{ n.creada_en|date:"d/m/Y H:i" }}</span></td><td>{% if n.leida_en %}Leída{% else %}Nueva{% endif %}</td></tr>{% empty %}<tr><td>No hay notificaciones.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
