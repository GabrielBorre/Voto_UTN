{% extends "gestion/base.html" %}{% block content %}<section class="hero hero-acciones"><div><h1>Notificaciones</h1><p>Mensajes recibidos.</p></div><div class="hero-botones"><button class="button hero-boton-secundario" type="button" data-volver>Volver</button></div></section><div class="table-wrap"><table><tbody>{% for n in notificaciones %}<tr><td><a href="{% url 'leer-notificacion' n.id %}">{{ n.asunto }}</a><br><span class="muted">{{ n.creada_en|date:"d/m/Y H:i" }}</span></td><td>{% if n.leida_en %}Leída{% else %}Nueva{% endif %}</td></tr>{% empty %}<tr><td>No hay notificaciones.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
